<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>lilgotchi launchers</title>
<style>body{background:#121619;color:#eef1ed;font:16px/1.5 system-ui;margin:32px}main{max-width:720px;margin:auto}.lineup{display:flex;flex-wrap:wrap;gap:28px}.lineup>div{display:grid;gap:12px;justify-items:center}lil-gotchi::part(launcher){position:relative;inset:auto}h1{font-size:28px}p{color:#bdc8be}</style></head>
<body><main><h1>A little color for every pet</h1><p>Each launcher matches its egg shell. Open one to meet its pet.</p><div class="lineup">
<div><span>Original egg</span><lil-gotchi character="default" storage-key="preview-original"></lil-gotchi></div>
<div><span>Slice</span><lil-gotchi character="slice" storage-key="preview-slice"></lil-gotchi></div>
<div><span>Cypunk</span><lil-gotchi character="cyberpunk" storage-key="preview-cypunk"></lil-gotchi></div>
<div><span>Lilgotchi</span><lil-gotchi character="lilgotchi" storage-key="preview-lilgotchi"></lil-gotchi></div>
<div><span>Without a shell</span><lil-gotchi character="lilgotchi" launcher="pet" storage-key="preview-no-shell"></lil-gotchi></div>
</div></main><script type="module" src="../lilgotchi.js"></script></body></html>
