<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Missoula movement review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17292f;color:#f8e7bd;font:16px monospace}header{padding:18px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}h1{font-size:19px;margin:0}label{display:flex;gap:8px;align-items:center}button,select{font:inherit;background:#f8e7bd;color:#17292f;padding:8px;border:0}canvas{display:block;width:100%;height:calc(100vh - 150px);min-height:380px;image-rendering:pixelated;outline:0}p{margin:12px 18px}output{display:block;padding:0 18px}a{color:inherit}
</style>
<header><h1>Missoula movement review</h1>
<label>Scene <select id="scene"><option value="town">Town</option><option value="arcade">Arcade</option><option value="cabin">Cabin</option><option value="rooftop">Roof</option></select></label>
<label>Destination <select id="destination"></select></label><button id="walk">Walk there</button>
<button id="freeze">Pause</button><label><input id="pizza" type="checkbox">Carry pizza</label><a href="../../8-bit-missoula/">Open game</a></header>
<canvas id="game" tabindex="0" role="img" aria-label="Live scene. Click to walk or use the arrow keys."></canvas>
<p>Click the scene or use arrow keys. Every destination uses the same movement and rendering as the game.</p><output id="status">Loading scene</output>
<script type="module" src="./review.js"></script></html>
